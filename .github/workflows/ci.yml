name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Lint
        run: pnpm lint

      # The suite needs no acoustic model: alignment and GOP run against the
      # torchaudio goldens in tests/fixtures/, and the scoring tests load the
      # 1 MB heads checked into releases/. Nothing here downloads 378 MB.
      - name: Test
        run: pnpm test
